name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false
      move-major-tag: false

  build:
    needs: versioning
    uses: f2calv/gha-workflows/.github/workflows/app-build-npm.yml@v1
    permissions:
      contents: read
    with:
      version: ${{ needs.versioning.outputs.version }}
      base-path: /${{ github.event.repository.name }}/
      browser-tests: true
      artifact-name: planner

  pages:
    needs: [lint, versioning, build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/pages-publish.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      artifact-name: planner
      version: ${{ needs.versioning.outputs.version }}
      publish: true

  release:
    needs: [lint, versioning, build, pages]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.versioning.outputs.release-exists == 'false'
      && needs.lint.result == 'success'
      && needs.versioning.result == 'success'
      && needs.build.result == 'success'
      && needs.pages.result == 'success'
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false
